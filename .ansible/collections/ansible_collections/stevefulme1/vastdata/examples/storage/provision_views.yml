---
# Provision storage views with quotas and policies.
#
# Usage:
#   ansible-playbook provision_views.yml \
#     -e vms_host=vms.example.com \
#     -e @vault.yml --ask-vault-pass
#
- name: Provision VAST Storage Views
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vms_host: "vms.example.com"
    api_token: "{{ vault_vast_api_token }}"

  tasks:
    - name: Create view policy for NFS exports
      stevefulme1.vastdata.vast_view_policy:
        vms_host: "{{ vms_host }}"
        api_token: "{{ api_token }}"
        name: "nfs-read-write-policy"
        flavor: NFS_EXPORT
        nfs_read_write:
          - "10.0.0.0/8"
        nfs_root_squash: root_squash
        auth_source: PROVIDERS
        state: present
      register: view_policy

    - name: Create NFS view for AI training data
      stevefulme1.vastdata.vast_view:
        vms_host: "{{ vms_host }}"
        api_token: "{{ api_token }}"
        name: "ai-training-data"
        path: "/data/ai/training"
        protocols:
          - NFS
          - S3
        policy_id: "{{ view_policy.resource.id }}"
        create_dir: true
        state: present
      register: view

    - name: Apply a 10 TiB quota
      stevefulme1.vastdata.vast_quota:
        vms_host: "{{ vms_host }}"
        api_token: "{{ api_token }}"
        name: "ai-training-quota"
        path: "/data/ai/training"
        hard_limit: 10995116277760
        soft_limit: 8796093022208
        grace_period: "7d"
        enable_alarms: true
        state: present

    - name: Show view details
      ansible.builtin.debug:
        msg: "View '{{ view.resource.name }}' created at {{ view.resource.path }}"
