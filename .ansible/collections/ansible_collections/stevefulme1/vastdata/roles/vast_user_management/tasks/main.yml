---
# tasks/main.yml for vast_user_management
# Bulk user and group provisioning

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - vast_user_management_host is defined
    fail_msg: "vast_user_management_host must be defined"
    quiet: true

- name: Execute vast user management
  ansible.builtin.debug:
    msg: >-
      Bulk user and group provisioning.
      Target: {{ vast_user_management_host }}
