---
# tasks/main.yml for vast_tenant_provision
# Create tenant with views, quotas, QoS, and share configuration

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - vast_tenant_provision_host | length > 0
      - vast_tenant_provision_name | length > 0
    fail_msg: >-
      vast_tenant_provision_host and vast_tenant_provision_name must be defined.
    quiet: true

- name: Build authentication parameters
  ansible.builtin.set_fact:
    vast_tenant_provision_auth:
      host: "{{ vast_tenant_provision_host }}"
      username: "{{ vast_tenant_provision_username }}"
      password: "{{ vast_tenant_provision_password | default(omit, true) }}"
      api_token: "{{ vast_tenant_provision_api_token | default(omit, true) }}"
      validate_certs: "{{ vast_tenant_provision_validate_certs }}"
  no_log: true

- name: Provision tenant
  block:
    - name: Create tenant
      stevefulme1.vastdata.vast_tenant:
        host: "{{ vast_tenant_provision_auth.host }}"
        username: "{{ vast_tenant_provision_auth.username }}"
        password: "{{ vast_tenant_provision_auth.password | default(omit) }}"
        api_token: "{{ vast_tenant_provision_auth.api_token | default(omit) }}"
        validate_certs: "{{ vast_tenant_provision_auth.validate_certs }}"
        name: "{{ vast_tenant_provision_name }}"
        state: "{{ vast_tenant_provision_state }}"
      register: vast_tenant_provision_tenant_result

    - name: Create user groups
      stevefulme1.vastdata.vast_group:
        host: "{{ vast_tenant_provision_auth.host }}"
        username: "{{ vast_tenant_provision_auth.username }}"
        password: "{{ vast_tenant_provision_auth.password | default(omit) }}"
        api_token: "{{ vast_tenant_provision_auth.api_token | default(omit) }}"
        validate_certs: "{{ vast_tenant_provision_auth.validate_certs }}"
        name: "{{ item.name }}"
        gid: "{{ item.gid }}"
        state: present
      loop: "{{ vast_tenant_provision_groups }}"
      when: vast_tenant_provision_groups | length > 0

    - name: Create view policies
      stevefulme1.vastdata.vast_view_policy:
        host: "{{ vast_tenant_provision_auth.host }}"
        username: "{{ vast_tenant_provision_auth.username }}"
        password: "{{ vast_tenant_provision_auth.password | default(omit) }}"
        api_token: "{{ vast_tenant_provision_auth.api_token | default(omit) }}"
        validate_certs: "{{ vast_tenant_provision_auth.validate_certs }}"
        name: "{{ item.name }}"
        flavor: "{{ item.flavor | default('NFS') }}"
        access_flavor: "{{ item.access_flavor | default('ROOT_SQUASH') }}"
        allowed_hosts: "{{ item.allowed_hosts | default(omit) }}"
        state: present
      loop: "{{ vast_tenant_provision_view_policies }}"
      when: vast_tenant_provision_view_policies | length > 0

    - name: Create views
      stevefulme1.vastdata.vast_view:
        host: "{{ vast_tenant_provision_auth.host }}"
        username: "{{ vast_tenant_provision_auth.username }}"
        password: "{{ vast_tenant_provision_auth.password | default(omit) }}"
        api_token: "{{ vast_tenant_provision_auth.api_token | default(omit) }}"
        validate_certs: "{{ vast_tenant_provision_auth.validate_certs }}"
        name: "{{ item.name }}"
        path: "{{ item.path }}"
        protocols: "{{ item.protocols | default(['NFS']) }}"
        policy: "{{ item.policy | default('default') }}"
        tenant: "{{ vast_tenant_provision_name }}"
        state: present
      loop: "{{ vast_tenant_provision_views }}"
      when: vast_tenant_provision_views | length > 0

    - name: Configure QoS policies
      stevefulme1.vastdata.vast_qos_policy:
        host: "{{ vast_tenant_provision_auth.host }}"
        username: "{{ vast_tenant_provision_auth.username }}"
        password: "{{ vast_tenant_provision_auth.password | default(omit) }}"
        api_token: "{{ vast_tenant_provision_auth.api_token | default(omit) }}"
        validate_certs: "{{ vast_tenant_provision_auth.validate_certs }}"
        name: "{{ item.name }}"
        static_limits: "{{ item.static_limits }}"
        state: present
      loop: "{{ vast_tenant_provision_qos_policies }}"
      when: vast_tenant_provision_qos_policies | length > 0

    - name: Configure quotas
      stevefulme1.vastdata.vast_quota:
        host: "{{ vast_tenant_provision_auth.host }}"
        username: "{{ vast_tenant_provision_auth.username }}"
        password: "{{ vast_tenant_provision_auth.password | default(omit) }}"
        api_token: "{{ vast_tenant_provision_auth.api_token | default(omit) }}"
        validate_certs: "{{ vast_tenant_provision_auth.validate_certs }}"
        name: "{{ item.name }}"
        path: "{{ item.path }}"
        hard_limit: "{{ item.hard_limit }}"
        soft_limit: "{{ item.soft_limit | default(omit) }}"
        grace_period: "{{ item.grace_period | default(omit) }}"
        tenant: "{{ vast_tenant_provision_name }}"
        state: present
      loop: "{{ vast_tenant_provision_quotas }}"
      when: vast_tenant_provision_quotas | length > 0

    - name: Create NFS exports
      stevefulme1.vastdata.vast_nfs_export:
        host: "{{ vast_tenant_provision_auth.host }}"
        username: "{{ vast_tenant_provision_auth.username }}"
        password: "{{ vast_tenant_provision_auth.password | default(omit) }}"
        api_token: "{{ vast_tenant_provision_auth.api_token | default(omit) }}"
        validate_certs: "{{ vast_tenant_provision_auth.validate_certs }}"
        name: "{{ item.name }}"
        path: "{{ item.path }}"
        allowed_hosts: "{{ item.allowed_hosts | default(omit) }}"
        protocols: "{{ item.protocols | default(['NFSv4']) }}"
        state: present
      loop: "{{ vast_tenant_provision_nfs_exports }}"
      when: vast_tenant_provision_nfs_exports | length > 0

    - name: Create SMB shares
      stevefulme1.vastdata.vast_smb_share:
        host: "{{ vast_tenant_provision_auth.host }}"
        username: "{{ vast_tenant_provision_auth.username }}"
        password: "{{ vast_tenant_provision_auth.password | default(omit) }}"
        api_token: "{{ vast_tenant_provision_auth.api_token | default(omit) }}"
        validate_certs: "{{ vast_tenant_provision_auth.validate_certs }}"
        name: "{{ item.name }}"
        path: "{{ item.path }}"
        directory_listing: "{{ item.directory_listing | default(true) }}"
        state: present
      loop: "{{ vast_tenant_provision_smb_shares }}"
      when: vast_tenant_provision_smb_shares | length > 0

    - name: Create S3 policies
      stevefulme1.vastdata.vast_s3_policy:
        host: "{{ vast_tenant_provision_auth.host }}"
        username: "{{ vast_tenant_provision_auth.username }}"
        password: "{{ vast_tenant_provision_auth.password | default(omit) }}"
        api_token: "{{ vast_tenant_provision_auth.api_token | default(omit) }}"
        validate_certs: "{{ vast_tenant_provision_auth.validate_certs }}"
        name: "{{ item.name }}"
        effect: "{{ item.effect | default('allow') }}"
        actions: "{{ item.actions }}"
        state: present
      loop: "{{ vast_tenant_provision_s3_policies }}"
      when: vast_tenant_provision_s3_policies | length > 0

  rescue:
    - name: Tenant provisioning failed
      ansible.builtin.fail:
        msg: >-
          Tenant provisioning failed for '{{ vast_tenant_provision_name }}':
          {{ ansible_failed_result.msg | default('unknown error') }}
