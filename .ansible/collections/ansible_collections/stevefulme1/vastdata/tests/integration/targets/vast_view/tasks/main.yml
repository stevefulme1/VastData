---
# Integration tests for stevefulme1.vastdata.vast_view

- name: Create a view
  stevefulme1.vastdata.vast_view:
    name: "{{ vast_test_view_name }}"
    path: "{{ vast_test_view_path }}"
    protocols:
      - NFS
    create_dir: true
    state: present
    vms_host: "{{ vast_vms_host }}"
    vms_user: "{{ vast_vms_user }}"
    vms_password: "{{ vast_vms_password }}"
    validate_certs: "{{ vast_validate_certs }}"
  register: create_result

- name: Verify view was created
  ansible.builtin.assert:
    that:
      - create_result is changed
      - create_result.resource.name == vast_test_view_name

- name: Create the same view again (idempotency)
  stevefulme1.vastdata.vast_view:
    name: "{{ vast_test_view_name }}"
    path: "{{ vast_test_view_path }}"
    protocols:
      - NFS
    create_dir: true
    state: present
    vms_host: "{{ vast_vms_host }}"
    vms_user: "{{ vast_vms_user }}"
    vms_password: "{{ vast_vms_password }}"
    validate_certs: "{{ vast_validate_certs }}"
  register: idempotent_result

- name: Verify no change on re-create
  ansible.builtin.assert:
    that:
      - idempotent_result is not changed

- name: Update view to add SMB protocol
  stevefulme1.vastdata.vast_view:
    name: "{{ vast_test_view_name }}"
    path: "{{ vast_test_view_path }}"
    protocols:
      - NFS
      - SMB
    state: present
    vms_host: "{{ vast_vms_host }}"
    vms_user: "{{ vast_vms_user }}"
    vms_password: "{{ vast_vms_password }}"
    validate_certs: "{{ vast_validate_certs }}"
  register: update_result

- name: Verify view was updated
  ansible.builtin.assert:
    that:
      - update_result is changed

- name: Delete view
  stevefulme1.vastdata.vast_view:
    name: "{{ vast_test_view_name }}"
    path: "{{ vast_test_view_path }}"
    state: absent
    vms_host: "{{ vast_vms_host }}"
    vms_user: "{{ vast_vms_user }}"
    vms_password: "{{ vast_vms_password }}"
    validate_certs: "{{ vast_validate_certs }}"
  register: delete_result

- name: Verify view was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed
