---
- name: Converge - VAST Data module CRUD tests
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vast_vms_host: "{{ lookup('env', 'VAST_VMS_HOST') | default('vms.example.com', true) }}"
    vast_vms_user: "{{ lookup('env', 'VAST_VMS_USER') | default('admin', true) }}"
    vast_vms_password: "{{ lookup('env', 'VAST_VMS_PASSWORD') | default('secret', true) }}"
    vast_validate_certs: "{{ lookup('env', 'VAST_VALIDATE_CERTS') | default(false, true) | bool }}"
    test_suffix: "{{ lookup('password', '/dev/null chars=ascii_lowercase length=6') }}"

  tasks:
    # ---- Tenant CRUD ----
    - name: Create test tenant
      stevefulme1.vastdata.vast_tenant:
        name: "molecule-tenant-{{ test_suffix }}"
        smb_privileged_user_name: "admin"
        default_others_share_level: "READ"
        state: present
        vms_host: "{{ vast_vms_host }}"
        vms_user: "{{ vast_vms_user }}"
        vms_password: "{{ vast_vms_password }}"
        validate_certs: "{{ vast_validate_certs }}"
      register: tenant_create

    - name: Assert tenant created
      ansible.builtin.assert:
        that:
          - tenant_create is changed

    # ---- View CRUD ----
    - name: Create test view
      stevefulme1.vastdata.vast_view:
        name: "molecule-view-{{ test_suffix }}"
        path: "/data/molecule-test"
        protocols:
          - NFS
        create_dir: true
        state: present
        vms_host: "{{ vast_vms_host }}"
        vms_user: "{{ vast_vms_user }}"
        vms_password: "{{ vast_vms_password }}"
        validate_certs: "{{ vast_validate_certs }}"
      register: view_create

    - name: Assert view created
      ansible.builtin.assert:
        that:
          - view_create is changed

    # ---- VIP Pool CRUD ----
    - name: Create test VIP pool
      stevefulme1.vastdata.vast_vip_pool:
        name: "molecule-vippool-{{ test_suffix }}"
        subnet_cidr: 24
        ip_ranges:
          - start_ip: "10.0.0.10"
            end_ip: "10.0.0.20"
        role: PROTOCOLS
        vlan: 100
        enabled: true
        state: present
        vms_host: "{{ vast_vms_host }}"
        vms_user: "{{ vast_vms_user }}"
        vms_password: "{{ vast_vms_password }}"
        validate_certs: "{{ vast_validate_certs }}"
      register: vippool_create

    - name: Assert VIP pool created
      ansible.builtin.assert:
        that:
          - vippool_create is changed

    # ---- Cleanup ----
    - name: Delete test VIP pool
      stevefulme1.vastdata.vast_vip_pool:
        name: "molecule-vippool-{{ test_suffix }}"
        subnet_cidr: 24
        state: absent
        vms_host: "{{ vast_vms_host }}"
        vms_user: "{{ vast_vms_user }}"
        vms_password: "{{ vast_vms_password }}"
        validate_certs: "{{ vast_validate_certs }}"

    - name: Delete test view
      stevefulme1.vastdata.vast_view:
        name: "molecule-view-{{ test_suffix }}"
        path: "/data/molecule-test"
        state: absent
        vms_host: "{{ vast_vms_host }}"
        vms_user: "{{ vast_vms_user }}"
        vms_password: "{{ vast_vms_password }}"
        validate_certs: "{{ vast_validate_certs }}"

    - name: Delete test tenant
      stevefulme1.vastdata.vast_tenant:
        name: "molecule-tenant-{{ test_suffix }}"
        state: absent
        vms_host: "{{ vast_vms_host }}"
        vms_user: "{{ vast_vms_user }}"
        vms_password: "{{ vast_vms_password }}"
        validate_certs: "{{ vast_validate_certs }}"
