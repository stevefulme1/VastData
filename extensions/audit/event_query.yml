---
# extensions/audit/event_query.yml
# Indirect Node Counting query for stevefulme1.vastdata
stevefulme1.vastdata.vast_volume:
  query: >-
    {
      name: .resource.name,
      canonical_facts: {
        uuid: (.resource.id | tostring)
      },
      facts: {
        device_type: "block_storage"
      }
    }

