---
- name: Converge - VAST Data resource CRUD
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vast_vms_host: "{{ lookup('env', 'VAST_VMS_HOST') }}"
    vast_vms_user: "{{ lookup('env', 'VAST_VMS_USER') }}"
    vast_vms_password: "{{ lookup('env', 'VAST_VMS_PASSWORD') }}"
    vast_validate_certs: false
    test_suffix: "{{ lookup('pipe', 'date +%s') }}"

  tasks:
    # ---- Tenant CRUD ----
    - name: Create test tenant
      vastdata.cluster.vast_tenant:
        vms_host: "{{ vast_vms_host }}"
        vms_user: "{{ vast_vms_user }}"
        vms_password: "{{ vast_vms_password }}"
        validate_certs: "{{ vast_validate_certs }}"
        name: "mol-tenant-{{ test_suffix }}"
        posix_primary_provider: "LDAP"
        state: present
      register: tenant_result

    - name: Verify tenant creation
      ansible.builtin.assert:
        that:
          - tenant_result is changed

    # ---- View CRUD ----
    - name: Create test view
      vastdata.cluster.vast_view:
        vms_host: "{{ vast_vms_host }}"
        vms_user: "{{ vast_vms_user }}"
        vms_password: "{{ vast_vms_password }}"
        validate_certs: "{{ vast_validate_certs }}"
        name: "mol-view-{{ test_suffix }}"
        path: "/data/mol-test"
        protocols:
          - "NFS"
        state: present
      register: view_result

    - name: Verify view creation
      ansible.builtin.assert:
        that:
          - view_result is changed

    # ---- VIP Pool CRUD ----
    - name: Create test VIP pool
      vastdata.cluster.vast_vip_pool:
        vms_host: "{{ vast_vms_host }}"
        vms_user: "{{ vast_vms_user }}"
        vms_password: "{{ vast_vms_password }}"
        validate_certs: "{{ vast_validate_certs }}"
        name: "mol-pool-{{ test_suffix }}"
        subnet_cidr: 24
        ip_ranges:
          - start_ip: "10.200.0.10"
            end_ip: "10.200.0.20"
        role: "PROTOCOLS"
        state: present
      register: pool_result

    - name: Verify VIP pool creation
      ansible.builtin.assert:
        that:
          - pool_result is changed
