---
# tasks/main.yml for vast_view_provision
# Create views with export policies

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - vast_view_provision_host is defined
    fail_msg: "vast_view_provision_host must be defined"
    quiet: true

- name: Execute vast view provision
  ansible.builtin.debug:
    msg: >-
      Create views with export policies.
      Target: {{ vast_view_provision_host }}
