---
# ---------------------------------------------------------
# vastdata.cluster.vast_view integration tests
# ---------------------------------------------------------

- name: Create NFS view
  vastdata.cluster.vast_view:
    vms_host: "{{ vast_vms_host }}"
    vms_user: "{{ vast_vms_user }}"
    vms_password: "{{ vast_vms_password }}"
    validate_certs: "{{ vast_validate_certs }}"
    name: "{{ vast_view_name }}"
    path: "{{ vast_view_path }}"
    protocols: "{{ vast_view_protocols }}"
    state: present
  register: create_result

- name: Verify view was created
  ansible.builtin.assert:
    that:
      - create_result is changed
      - create_result.resource.name == vast_view_name

- name: Create view again (idempotency)
  vastdata.cluster.vast_view:
    vms_host: "{{ vast_vms_host }}"
    vms_user: "{{ vast_vms_user }}"
    vms_password: "{{ vast_vms_password }}"
    validate_certs: "{{ vast_validate_certs }}"
    name: "{{ vast_view_name }}"
    path: "{{ vast_view_path }}"
    protocols: "{{ vast_view_protocols }}"
    state: present
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Update view with S3 versioning
  vastdata.cluster.vast_view:
    vms_host: "{{ vast_vms_host }}"
    vms_user: "{{ vast_vms_user }}"
    vms_password: "{{ vast_vms_password }}"
    validate_certs: "{{ vast_validate_certs }}"
    name: "{{ vast_view_name }}"
    path: "{{ vast_view_path }}"
    s3_versioning: true
    state: present
  register: update_result

- name: Verify view was updated
  ansible.builtin.assert:
    that:
      - update_result is changed

- name: Delete view
  vastdata.cluster.vast_view:
    vms_host: "{{ vast_vms_host }}"
    vms_user: "{{ vast_vms_user }}"
    vms_password: "{{ vast_vms_password }}"
    validate_certs: "{{ vast_validate_certs }}"
    name: "{{ vast_view_name }}"
    state: absent
  register: delete_result

- name: Verify view was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete view again (idempotency)
  vastdata.cluster.vast_view:
    vms_host: "{{ vast_vms_host }}"
    vms_user: "{{ vast_vms_user }}"
    vms_password: "{{ vast_vms_password }}"
    validate_certs: "{{ vast_validate_certs }}"
    name: "{{ vast_view_name }}"
    state: absent
  register: delete_idem_result

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem_result is not changed
