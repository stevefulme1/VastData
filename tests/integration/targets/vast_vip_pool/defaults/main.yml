---
vast_vms_host: "{{ lookup('env', 'VAST_VMS_HOST') }}"
vast_vms_user: "{{ lookup('env', 'VAST_VMS_USER') }}"
vast_vms_password: "{{ lookup('env', 'VAST_VMS_PASSWORD') }}"
vast_validate_certs: false

vast_vip_pool_name: "ci-test-pool-{{ lookup('pipe', 'date +%s') }}"
vast_vip_pool_subnet_cidr: 24
vast_vip_pool_role: "PROTOCOLS"
vast_vip_pool_ip_ranges:
  - start_ip: "10.100.0.10"
    end_ip: "10.100.0.20"
