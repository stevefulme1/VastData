---
# Integration tests for stevefulme1.vastdata.vast_vip_pool

- name: Create a VIP pool
  stevefulme1.vastdata.vast_vip_pool:
    name: "{{ vast_test_vip_pool_name }}"
    subnet_cidr: "{{ vast_test_subnet_cidr }}"
    ip_ranges:
      - start_ip: "192.168.1.10"
        end_ip: "192.168.1.20"
    role: PROTOCOLS
    vlan: "{{ vast_test_vlan }}"
    enabled: true
    state: present
    vms_host: "{{ vast_vms_host }}"
    vms_user: "{{ vast_vms_user }}"
    vms_password: "{{ vast_vms_password }}"
    validate_certs: "{{ vast_validate_certs }}"
  register: create_result

- name: Verify VIP pool was created
  ansible.builtin.assert:
    that:
      - create_result is changed
      - create_result.resource.name == vast_test_vip_pool_name

- name: Create the same VIP pool again (idempotency)
  stevefulme1.vastdata.vast_vip_pool:
    name: "{{ vast_test_vip_pool_name }}"
    subnet_cidr: "{{ vast_test_subnet_cidr }}"
    ip_ranges:
      - start_ip: "192.168.1.10"
        end_ip: "192.168.1.20"
    role: PROTOCOLS
    vlan: "{{ vast_test_vlan }}"
    enabled: true
    state: present
    vms_host: "{{ vast_vms_host }}"
    vms_user: "{{ vast_vms_user }}"
    vms_password: "{{ vast_vms_password }}"
    validate_certs: "{{ vast_validate_certs }}"
  register: idempotent_result

- name: Verify no change on re-create
  ansible.builtin.assert:
    that:
      - idempotent_result is not changed

- name: Update VIP pool VLAN
  stevefulme1.vastdata.vast_vip_pool:
    name: "{{ vast_test_vip_pool_name }}"
    subnet_cidr: "{{ vast_test_subnet_cidr }}"
    vlan: 200
    state: present
    vms_host: "{{ vast_vms_host }}"
    vms_user: "{{ vast_vms_user }}"
    vms_password: "{{ vast_vms_password }}"
    validate_certs: "{{ vast_validate_certs }}"
  register: update_result

- name: Verify VIP pool was updated
  ansible.builtin.assert:
    that:
      - update_result is changed

- name: Delete VIP pool
  stevefulme1.vastdata.vast_vip_pool:
    name: "{{ vast_test_vip_pool_name }}"
    subnet_cidr: "{{ vast_test_subnet_cidr }}"
    state: absent
    vms_host: "{{ vast_vms_host }}"
    vms_user: "{{ vast_vms_user }}"
    vms_password: "{{ vast_vms_password }}"
    validate_certs: "{{ vast_validate_certs }}"
  register: delete_result

- name: Verify VIP pool was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed
