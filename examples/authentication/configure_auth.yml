---
# Configure authentication providers: LDAP, Active Directory, and SAML.
#
# Usage:
#   ansible-playbook configure_auth.yml \
#     -e vms_host=vms.example.com \
#     -e @vault.yml --ask-vault-pass
#
- name: Configure VAST Authentication
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vms_host: "vms.example.com"
    api_token: "{{ vault_vast_api_token }}"

  tasks:
    - name: Configure LDAP provider
      vastdata.cluster.vast_ldap:
        vms_host: "{{ vms_host }}"
        api_token: "{{ api_token }}"
        name: "corporate-ldap"
        urls:
          - "ldaps://ldap.example.com"
        base_dn: "dc=example,dc=com"
        bind_dn: "cn=vast-svc,ou=services,dc=example,dc=com"
        bind_password: "{{ vault_ldap_bind_password }}"
        user_search_base: "ou=users"
        group_search_base: "ou=groups"
        use_tls: true
        state: present

    - name: Configure Active Directory
      vastdata.cluster.vast_active_directory:
        vms_host: "{{ vms_host }}"
        api_token: "{{ api_token }}"
        machine_account_name: "VAST-CLUSTER"
        domain_name: "corp.example.com"
        organizational_unit: "OU=Servers,DC=corp,DC=example,DC=com"
        preferred_dc_list:
          - "dc1.corp.example.com"
          - "dc2.corp.example.com"
        username: "{{ vault_ad_username }}"
        password: "{{ vault_ad_password }}"
        state: present

    - name: Configure SAML SSO
      vastdata.cluster.vast_saml_config:
        vms_host: "{{ vms_host }}"
        api_token: "{{ api_token }}"
        name: "okta-sso"
        idp_entity_id: "https://okta.example.com/sso/saml2"
        idp_sso_url: "https://okta.example.com/app/vast/sso/saml"
        idp_certificate: "{{ lookup('file', 'okta-cert.pem') }}"
        sign_requests: true
        enabled: true
        state: present
