---
# Provision a complete multi-tenant environment.
#
# Usage:
#   ansible-playbook provision_tenant.yml \
#     -e vms_host=vms.example.com \
#     -e tenant_name=team-alpha \
#     -e @vault.yml --ask-vault-pass
#
- name: Provision VAST Multi-Tenant Environment
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vms_host: "vms.example.com"
    api_token: "{{ vault_vast_api_token }}"
    tenant_name: "team-alpha"

  tasks:
    - name: Create tenant
      stevefulme1.vastdata.vast_tenant:
        vms_host: "{{ vms_host }}"
        api_token: "{{ api_token }}"
        name: "{{ tenant_name }}"
        posix_primary_provider: LDAP
        client_ip_ranges:
          - start_ip: "10.0.1.0"
            end_ip: "10.0.1.255"
        state: present
      register: tenant

    - name: Create tenant VIP pool
      stevefulme1.vastdata.vast_vip_pool:
        vms_host: "{{ vms_host }}"
        api_token: "{{ api_token }}"
        name: "{{ tenant_name }}-vips"
        subnet_cidr: 24
        ip_ranges:
          - start_ip: "10.0.20.10"
            end_ip: "10.0.20.50"
        role: PROTOCOLS
        tenant_id: "{{ tenant.resource.id }}"
        state: present

    - name: Create tenant view
      stevefulme1.vastdata.vast_view:
        vms_host: "{{ vms_host }}"
        api_token: "{{ api_token }}"
        name: "{{ tenant_name }}-data"
        path: "/tenants/{{ tenant_name }}/data"
        protocols:
          - NFS
          - S3
        tenant_id: "{{ tenant.resource.id }}"
        create_dir: true
        state: present

    - name: Apply tenant quota
      stevefulme1.vastdata.vast_quota:
        vms_host: "{{ vms_host }}"
        api_token: "{{ api_token }}"
        name: "{{ tenant_name }}-quota"
        path: "/tenants/{{ tenant_name }}"
        tenant_id: "{{ tenant.resource.id }}"
        hard_limit: 5497558138880
        soft_limit: 4398046511104
        enable_alarms: true
        state: present

    - name: Apply QoS policy
      stevefulme1.vastdata.vast_qos_policy:
        vms_host: "{{ vms_host }}"
        api_token: "{{ api_token }}"
        name: "{{ tenant_name }}-qos"
        max_reads_bw_mbps: 10000
        max_writes_bw_mbps: 5000
        max_reads_iops: 100000
        max_writes_iops: 50000
        mode: PROVISIONED_CAPACITY
        tenant_id: "{{ tenant.resource.id }}"
        state: present

    - name: Show tenant summary
      ansible.builtin.debug:
        msg: >-
          Tenant '{{ tenant_name }}' provisioned with
          ID {{ tenant.resource.id }}.
